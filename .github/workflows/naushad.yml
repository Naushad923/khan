name: teacher days
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aaj_ki_din_teacher_ke_name:
    runs-on: self-hosted  
    steps:
    - name: checkout  
      uses: actions/checkout@v4


    - name: Azurelogin
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}    

    - name: Init
      run: terraform init
    - name: Plan
      run: terraform init  

